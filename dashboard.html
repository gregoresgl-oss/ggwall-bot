<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GGWALL Monitor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #0c0f14;
  --surface: #14181f;
  --line: rgba(255,255,255,0.06);
  --text: #e8ecf2;
  --dim: #7a828f;
  --dimmer: #4a515c;
  --accent: #4ade80;
  --accent-soft: rgba(74,222,128,0.1);
  --blue: #60a5fa;
  --amber: #fbbf24;
  --red: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
body { min-height:100vh; }

@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes softPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.wrap { max-width:920px; margin:0 auto; padding:32px 20px 48px; }

/* Header */
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:36px; animation:fadeUp .4s ease; }
.brand { display:flex; align-items:center; gap:12px; }
.brand .mark { width:32px; height:32px; border-radius:8px; background:var(--accent-soft); border:1px solid rgba(74,222,128,0.25); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--accent); }
.brand .txt h1 { font-size:15px; font-weight:600; letter-spacing:-0.2px; }
.brand .txt p { font-size:12px; color:var(--dim); margin-top:1px; }
.status { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); font-family:'JetBrains Mono'; }
.status .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:softPulse 2s infinite; }

/* Stat grid */
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; animation:fadeUp .4s ease backwards; }
.stat .label { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:10px; }
.stat .val { font-family:'JetBrains Mono'; font-size:30px; font-weight:600; letter-spacing:-1px; }
.stat .val.green { color:var(--accent); }
.stat .val.blue { color:var(--blue); }
.stat .val.amber { color:var(--amber); }
.stat .sub { font-size:11px; color:var(--dimmer); margin-top:6px; font-family:'JetBrains Mono'; }

/* Two-col */
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }

/* Card */
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; animation:fadeUp .4s ease backwards; }
.card h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:16px; font-weight:600; }

/* Win rate */
.rate { display:flex; align-items:center; gap:20px; }
.ring { position:relative; width:88px; height:88px; flex-shrink:0; }
.ring svg { transform:rotate(-90deg); }
.ring .bg { fill:none; stroke:rgba(255,255,255,0.05); stroke-width:7; }
.ring .fg { fill:none; stroke:var(--accent); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1); }
.ring .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-weight:600; font-size:22px; }
.rate-meta { font-size:13px; color:var(--dim); line-height:1.7; font-family:'JetBrains Mono'; }
.rate-meta b { color:var(--text); }

/* Speed */
.speed .big { font-family:'JetBrains Mono'; font-size:38px; font-weight:600; color:var(--blue); }
.speed .big span { font-size:16px; color:var(--dim); }
.speed .track { height:4px; background:rgba(255,255,255,0.05); border-radius:2px; margin-top:16px; overflow:hidden; }
.speed .track .fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--blue)); border-radius:2px; width:0; transition:width 1s ease; }
.speed .note { font-size:11px; color:var(--dimmer); margin-top:10px; }

/* Tokens */
.tokens { display:flex; flex-direction:column; gap:2px; }
.token-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-family:'JetBrains Mono'; }
.token-row:last-child { border:none; }
.token-row .name { font-size:13px; color:var(--text); }
.token-row .amt { font-size:15px; font-weight:600; color:var(--accent); }
.token-empty { font-size:12px; color:var(--dimmer); font-family:'JetBrains Mono'; padding:8px 0; }

/* Channels */
.chans { display:flex; flex-wrap:wrap; gap:8px; }
.chip { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.03); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:12px; font-family:'JetBrains Mono'; color:var(--text); }
.chip .d { width:5px; height:5px; border-radius:50%; background:var(--accent); }

/* Feed */
.feed-card { margin-top:12px; }
.feed { display:flex; flex-direction:column; }
.fr { display:grid; grid-template-columns:56px 1fr auto; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); font-size:13px; animation:fadeUp .3s ease backwards; }
.fr:last-child { border:none; }
.fr .t { color:var(--dimmer); font-family:'JetBrains Mono'; font-size:12px; }
.fr .c { color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fr .r { font-family:'JetBrains Mono'; font-size:12px; text-align:right; white-space:nowrap; }
.fr .r.ok { color:var(--accent); }
.fr .r.det { color:var(--dim); }
.empty { text-align:center; padding:48px 20px; color:var(--dimmer); font-size:13px; }
.empty .i { font-size:24px; margin-bottom:12px; opacity:0.4; }

.foot { margin-top:24px; text-align:center; font-size:11px; color:var(--dimmer); font-family:'JetBrains Mono'; }

@media (max-width:720px) {
  .stats { grid-template-columns:repeat(2,1fr); }
  .row2 { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="mark">GG</div>
      <div class="txt">
        <h1>GGWALL Monitor</h1>
        <p>Giveaway auto-claim</p>
      </div>
    </div>
    <div class="status"><span class="dot"></span><span id="s-txt">online</span></div>
  </div>

  <div class="stats">
    <div class="stat" style="animation-delay:0ms"><div class="label">Signals</div><div class="val" id="m-alerts">0</div><div class="sub">detected</div></div>
    <div class="stat" style="animation-delay:40ms"><div class="label">Claims</div><div class="val green" id="m-success">0</div><div class="sub">successful</div></div>
    <div class="stat" style="animation-delay:80ms"><div class="label">Clicks</div><div class="val blue" id="m-clicks">0</div><div class="sub">fired</div></div>
    <div class="stat" style="animation-delay:120ms"><div class="label">Missed</div><div class="val amber" id="m-fail">0</div><div class="sub">failed</div></div>
  </div>

  <div class="row2">
    <div class="card" style="animation-delay:160ms">
      <h2>Hit rate</h2>
      <div class="rate">
        <div class="ring">
          <svg width="88" height="88" viewBox="0 0 88 88">
            <circle class="bg" cx="44" cy="44" r="38"/>
            <circle class="fg" id="ring" cx="44" cy="44" r="38" stroke-dasharray="239" stroke-dashoffset="239"/>
          </svg>
          <div class="num" id="r-pct">0%</div>
        </div>
        <div class="rate-meta">
          <div>success <b id="r-succ">0</b></div>
          <div>attempts <b id="r-tot">0</b></div>
        </div>
      </div>
    </div>

    <div class="card speed" style="animation-delay:200ms">
      <h2>Fastest reaction</h2>
      <div class="big"><span id="m-fastest">—</span><span>s</span></div>
      <div class="track"><div class="fill" id="speed-fill"></div></div>
      <div class="note">click latency after giveaway detected</div>
    </div>
  </div>

  <div class="row2">
    <div class="card" style="animation-delay:240ms">
      <h2>Tokens claimed</h2>
      <div class="tokens" id="tokens"></div>
    </div>

    <div class="card" style="animation-delay:280ms">
      <h2>Watching</h2>
      <div class="chans" id="chans"></div>
    </div>
  </div>

  <div class="card feed-card" style="animation-delay:320ms">
    <h2>Recent activity</h2>
    <div class="feed" id="feed"></div>
  </div>

  <div class="foot">GGWALL v3.0 · <span id="last-upd">—</span> · <span id="refresh-btn" style="color:var(--accent);cursor:pointer;text-decoration:underline;">refresh</span></div>
</div>

<script>
const API = window.location.origin;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
async function J(p){try{const r=await fetch(API+p);return await r.json();}catch(e){return null;}}
function anim(el,target,dur=700){const start=parseInt(el.textContent)||0;const t0=performance.now();function s(t){const p=Math.min((t-t0)/dur,1);const e=1-Math.pow(1-p,3);el.textContent=Math.round(start+(target-start)*e);if(p<1)requestAnimationFrame(s);}requestAnimationFrame(s);}

// Parse token amounts from alert messages
function parseTokens(alerts){
  const totals = {};
  (alerts||[]).forEach(a=>{
    if(!a.autoClicked) return; // only count successful claims
    const msg = (a.message||'') + ' ' + (a.keyword||'');
    // Match patterns like "0.5 $ATOM", "2.17 $ATOM", "1,666.67 $ATOM1KLFG"
    const re = /([\d,]+\.?\d*)\s*\$?([A-Z][A-Z0-9]+)/g;
    let m;
    while((m = re.exec(msg))!==null){
      const amt = parseFloat(m[1].replace(/,/g,''));
      const sym = m[2];
      if(!isNaN(amt) && amt>0 && amt<10000000){
        totals[sym] = (totals[sym]||0) + amt;
      }
    }
  });
  return totals;
}

async function load(){
  const [stats,settings,alerts] = await Promise.all([J('/api/stats'),J('/api/settings'),J('/api/alerts')]);
  if(!stats){document.getElementById('s-txt').textContent='offline';return;}
  render(stats, settings, alerts);
  document.getElementById('last-upd').textContent = 'updated ' + new Date().toLocaleTimeString('el-GR');
}

function render(stats, settings, alerts){
  anim(document.getElementById('m-alerts'), stats.total_alerts||0);
  anim(document.getElementById('m-success'), stats.successful_clicks||0);
  anim(document.getElementById('m-clicks'), stats.total_clicks||0);
  anim(document.getElementById('m-fail'), stats.failed_clicks||0);

  const tot=stats.total_clicks||0, succ=stats.successful_clicks||0;
  const wr=tot>0?Math.round(succ/tot*100):0;
  document.getElementById('r-pct').textContent=wr+'%';
  document.getElementById('r-succ').textContent=succ;
  document.getElementById('r-tot').textContent=tot;
  document.getElementById('ring').style.strokeDashoffset=(2*Math.PI*38)*(1-wr/100);

  const fast=stats.fastest_click;
  document.getElementById('m-fastest').textContent=fast!=null?fast.toFixed(2):'—';
  if(fast!=null){document.getElementById('speed-fill').style.width=Math.max(5,Math.min(100,(20-fast)/20*100))+'%';}

  const tk = stats.tokens || {};
  const tel = document.getElementById('tokens');
  const keys = Object.keys(tk).sort((a,b)=>tk[b]-tk[a]);
  if(keys.length===0){
    tel.innerHTML='<div class="token-empty">no claims recorded yet</div>';
  } else {
    tel.innerHTML=keys.slice(0,6).map(k=>{
      const v=tk[k];
      const disp=v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:0}):(v%1===0?String(v):v.toFixed(2));
      return `<div class="token-row"><span class="name">$${esc(k)}</span><span class="amt">${disp}</span></div>`;
    }).join('');
  }

  const cel=document.getElementById('chans');
  cel.innerHTML=(settings?.channels||[]).map(c=>`<span class="chip"><span class="d"></span>${esc(c)}</span>`).join('')||'<div class="token-empty">none</div>';

  const fel=document.getElementById('feed');
  if(!alerts||alerts.length===0){
    fel.innerHTML='<div class="empty"><div class="i">○</div>Waiting for the next giveaway…</div>';
  } else {
    fel.innerHTML=alerts.slice(0,15).map((a,i)=>{
      const ok=a.autoClicked;
      const r=ok?`✓ ${a.clickTime||''}`:'detected';
      return `<div class="fr" style="animation-delay:${i*30}ms"><span class="t">${esc(a.time||'')}</span><span class="c">${esc(a.channel||'—')}</span><span class="r ${ok?'ok':'det'}">${esc(r)}</span></div>`;
    }).join('');
  }
}

// Load once on page open
load();

// Manual refresh only (saves Railway logs/credits)
document.getElementById('refresh-btn').addEventListener('click', ()=>{
  const btn = document.getElementById('refresh-btn');
  btn.textContent = 'refreshing…';
  load().then(()=>{ btn.textContent = 'refresh'; });
});
</script>
</body>
</html>
